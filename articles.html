<meta property="og:type" content="website">

<meta property="og:title" content="Статьи об аккумуляторах — Ампер">
<meta property="og:description" content="Полезные статьи про автомобильные аккумуляторы: как выбрать, когда менять, чем отличаются AGM и EFB, зачем зарядное устройство.">

<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-hero-page">
<div id="header-mount"></div>
<div class="articles-page-section">
<div id="breadcrumb-mount"></div>

<div class="container">
  <div class="articles-page-header">
    <div class="articles-page-title-row">
      <h1 class="articles-page-title">Статьи</h1>
      <span class="articles-count" id="articles-count"></span>
    </div>
    <!-- свой выпадающий список вместо <select>: системный не оформить под макет -->
    <div class="sort" id="articles-sort" data-value="new">
      <div class="sort-label">Сортировка</div>
      <button class="sort-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="sort-current">Сначала новые</span>
      </button>
      <div class="sort-list" role="listbox">
        <button type="button" role="option" data-value="new">Сначала новые</button>
        <button type="button" role="option" data-value="editor">По популярности</button>
        <button type="button" role="option" data-value="old">Сначала старые</button>
      </div>
    </div>
  </div>

  <div class="articles-page-grid" id="articles-list"></div>

  <div class="load-more">
    <button class="btn btn-outline" onclick="loadMore()">Смотреть ещё</button>
  </div>
</div>
</div>

<div id="cta-mount"></div>
<div id="footer-mount"></div>
<script src="js/stat.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/articles-data.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('header-mount').innerHTML = renderHeader('articles.html');
  document.getElementById('breadcrumb-mount').innerHTML = renderBreadcrumb([
    {href:'index.html',label:'Главная'},
    {href:'articles.html',label:'Статьи'}
  ]);
  document.getElementById('cta-mount').innerHTML = renderCtaForm();
  document.getElementById('footer-mount').innerHTML = renderFooter();

  const PAGE = 8;             // сколько карточек показываем за раз
  let shown = PAGE;

  // «По популярности» пока = порядок в js/articles-data.js: реальных
  // просмотров у нас нет. Когда накопится статистика из своей метрики,
  // сюда можно подставить сортировку по числу открытий.
  const sortEl = document.getElementById('articles-sort');

  function sorted() {
    const mode = sortEl.dataset.value;
    const list = ARTICLES.slice();
    if (mode === 'new') return list.sort((a, b) => b.date.localeCompare(a.date));
    if (mode === 'old') return list.sort((a, b) => a.date.localeCompare(b.date));
    return list;
  }

  function draw() {
    const list = sorted();
    document.getElementById('articles-list').innerHTML =
      list.slice(0, shown).map(articleCard).join('');
    document.getElementById('articles-count').textContent = ARTICLES.length;
    // кнопку прячем, когда показывать больше нечего
    document.querySelector('.load-more').hidden = shown >= list.length;
    initReveal();
  }

  function loadMore() { shown += PAGE; draw(); }

  initSortDropdown(sortEl, () => { shown = PAGE; draw(); });
  draw();
</script>
</body>
</html>
