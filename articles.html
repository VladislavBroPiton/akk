<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статьи об аккумуляторах — Ампер</title>
<meta name="description" content="Полезные статьи про автомобильные аккумуляторы: как выбрать, когда менять, чем отличаются AGM и EFB, зачем зарядное устройство.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header-mount"></div>
<div id="breadcrumb-mount"></div>

<div class="container">
  <div class="articles-page-header">
    <h1 class="articles-page-title">Статьи</h1>
    <span class="articles-count" id="articles-count"></span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;">
      Сортировка:
      <select class="sort-select" id="articles-sort">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="editor">По популярности</option>
      </select>
    </div>
  </div>

  <div class="articles-page-grid" id="articles-list"></div>

  <div class="load-more">
    <button class="btn btn-outline" onclick="loadMore()">Смотреть ещё</button>
  </div>
</div>

<div id="cta-mount"></div>
<div id="footer-mount"></div>
<script src="js/stat.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/articles-data.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('header-mount').innerHTML = renderHeader('articles.html');
  document.getElementById('breadcrumb-mount').innerHTML = renderBreadcrumb([
    {href:'index.html',label:'Главная'},
    {href:'articles.html',label:'Статьи'}
  ]);
  document.getElementById('cta-mount').innerHTML = renderCtaForm();
  document.getElementById('footer-mount').innerHTML = renderFooter();

  const PAGE = 8;             // сколько карточек показываем за раз
  let shown = PAGE;

  // «По популярности» пока = порядок в js/articles-data.js: реальных
  // просмотров у нас нет. Когда накопится статистика из своей метрики,
  // сюда можно подставить сортировку по числу открытий.
  function sorted() {
    const mode = document.getElementById('articles-sort').value;
    const list = ARTICLES.slice();
    if (mode === 'new') return list.sort((a, b) => b.date.localeCompare(a.date));
    if (mode === 'old') return list.sort((a, b) => a.date.localeCompare(b.date));
    return list;
  }

  function draw() {
    const list = sorted();
    document.getElementById('articles-list').innerHTML =
      list.slice(0, shown).map(articleCard).join('');
    document.getElementById('articles-count').textContent = ARTICLES.length;
    // кнопку прячем, когда показывать больше нечего
    document.querySelector('.load-more').hidden = shown >= list.length;
    initReveal();
  }

  function loadMore() { shown += PAGE; draw(); }

  document.getElementById('articles-sort').addEventListener('change', () => { shown = PAGE; draw(); });
  draw();
</script>
</body>
</html>
