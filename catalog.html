<!DOCTYPE html>
<!-- Сайт разработал: https://t.me/Bro_piton -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — Ампер</title>
<meta name="description" content="Каталог аккумуляторов, зарядных устройств и аксессуаров в Волжском. Подбор по ёмкости, полярности, бренду и типу техники.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ампер">
<meta property="og:locale" content="ru_RU">
<meta property="og:url" content="https://vladislavbropiton.github.io/akk/catalog.html">
<meta property="og:title" content="Каталог — Ампер">
<meta property="og:description" content="Каталог аккумуляторов, зарядных устройств и аксессуаров в Волжском. Подбор по ёмкости, полярности, бренду и типу техники.">
<meta property="og:image" content="https://vladislavbropiton.github.io/akk/img/ill-battery.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-hero-page">
<div id="header-mount"></div>
<div id="breadcrumb-mount"></div>

<!-- ── СОСТОЯНИЕ A: витрина каталога (вход через кнопку «Каталог») ── -->
<section class="catalog-showcase" id="showcase" hidden>
  <div class="container">
    <h1 class="section-title" style="margin-bottom:32px;">Каталог</h1>
    <div class="categories-grid" id="showcase-grid"></div>
  </div>
</section>

<!-- ── СОСТОЯНИЕ B: листинг раздела (вход через выбор категории) ── -->
<div class="container" id="listing" hidden>
  <!-- по макету заголовок раздела — над сайдбаром и плитками, во всю ширину -->
  <div class="catalog-count" id="cat-title"></div>
  <div class="catalog-layout">
    <!-- левая колонка (тулбар+сайдбар) отдельным flex-контейнером — иначе
         в гриде она делит строки с высокими плитками справа, и высота
         плитки навязывает лишний пустой отступ перед сайдбаром -->
    <div class="catalog-sidebar-col">
      <!-- кнопка-воронка (только на мобиле, открывает панель фильтра) + сортировка —
           по макету видны на странице сразу, не спрятаны внутри панели фильтра -->
      <div class="catalog-toolbar">
        <button class="filter-toggle-btn" id="filterToggle" onclick="toggleFilter()" style="display:none;" aria-label="Открыть фильтр"></button>
        <div id="catalog-sort-mount"></div>
      </div>

      <!-- сайдбар (чекбоксы фильтра) собирается из конфига раздела в CatalogUI.renderSidebar() -->
      <aside class="sidebar" id="sidebar"></aside>
      <!-- крестик закрытия шторки на моб. — вне #sidebar: у панели overflow-y:auto,
           и кнопка внутри неё с отрицательным top не ловила клики (обрезалась
           контекстом прокрутки), поэтому вынесена отдельным элементом -->
      <button class="filter-close" type="button" onclick="toggleFilter()" aria-label="Закрыть фильтр">✕</button>
    </div>

    <div class="catalog-content-col">
      <div class="cat-tiles" id="cat-tiles"></div>

      <div class="cat-main">
        <div class="products-grid" id="cat-grid"></div>

        <div class="catalog-empty" id="cat-empty" hidden>
          <div class="catalog-empty-title">Ничего не найдено</div>
          <p>Попробуйте ослабить условия или сбросить фильтры</p>
          <button class="btn btn-outline" type="button" onclick="CatalogUI.reset()">Сбросить фильтры</button>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div id="cta-mount"></div>
<div id="footer-mount"></div>
<script src="js/stat.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('header-mount').innerHTML = renderHeader('catalog.html');
  document.getElementById('cta-mount').innerHTML = renderCtaForm();
  document.getElementById('footer-mount').innerHTML = renderFooter();

  loadCatalog().then(data => {
    const catKey = getParam('cat');
    const section = data[catKey];

    if (!section) {
      // ── Витрина разделов ──
      document.getElementById('breadcrumb-mount').innerHTML = renderBreadcrumb([
        { href: 'index.html',   label: 'Главная' },
        { href: 'catalog.html', label: 'Каталог' },
      ]);
      document.getElementById('showcase').hidden = false;
      document.getElementById('showcase-grid').innerHTML = Object.keys(data).map(key => `
        <a href="catalog.html?cat=${key}" class="category-card">
          <div class="category-card-img"><img src="${data[key].ill}" alt="${data[key].label}"></div>
          <div class="category-card-name">${data[key].label}</div>
          <p class="category-card-desc">${data[key].desc}</p>
          <span class="btn-link">Подробнее</span>
        </a>`).join('');
      initReveal();
      return;
    }

    // ── Листинг раздела ──
    document.title = `${section.label} — Ампер`;
    document.getElementById('breadcrumb-mount').innerHTML = renderBreadcrumb([
      { href: 'index.html',   label: 'Главная' },
      { href: 'catalog.html', label: 'Каталог' },
      { href: `catalog.html?cat=${catKey}`, label: section.label },
    ]);
    document.getElementById('listing').hidden = false;
    document.getElementById('cat-tiles').innerHTML = Object.keys(data).map(key => `
      <a href="catalog.html?cat=${key}" class="cat-tile ${key === catKey ? 'active' : ''}">
        <img class="cat-tile-icon" src="${data[key].ill}" alt="">

        ${data[key].label}
      </a>`).join('');

    CatalogUI.init({
      key: catKey,
      section: section,
      defs: FILTER_DEFS,
      cardSpecs: CARD_SPECS[catKey],
    });

    // сайдбар собирается динамически — навешиваем сворачивание секций после него
    initFilterCollapse();
  });
</script>
</body>
</html>
